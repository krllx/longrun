<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#222" stroke-width="1"/></pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,1 L7,5 L0,9 z" fill="#d97757"/></marker>
  </defs>
  <rect width="1600" height="600" fill="#141414"/>
  <rect width="1600" height="600" fill="url(#grid)"/>
  <text x="90" y="150" font-size="72" font-weight="700" fill="#f2f0eb" letter-spacing="-1">longrun</text>
  <text x="92" y="194" font-size="20" fill="#9a9a94">memory for Claude Code that survives compaction</text>
  <text x="600" y="120" font-size="16" fill="#6d6d68" letter-spacing="2">MODEL CONTEXT OVER TIME</text>
  <line x1="600" y1="300" x2="1500" y2="300" stroke="#3a3a38" stroke-width="2"/>
  <g>
    <rect x="620" y="150" width="240" height="140" rx="14" fill="#1f2230" stroke="#4a5480" stroke-width="2"/>
    <g stroke="#8a93bf" stroke-width="4" stroke-linecap="round">
      <line x1="640" y1="176" x2="820" y2="176"/><line x1="640" y1="196" x2="790" y2="196"/><line x1="640" y1="216" x2="830" y2="216"/>
      <line x1="640" y1="236" x2="760" y2="236"/><line x1="640" y1="256" x2="810" y2="256"/><line x1="640" y1="276" x2="720" y2="276"/>
    </g>
  </g>
  <path d="M870,220 L920,220" stroke="#6d6d68" stroke-width="3" marker-end="url(#arr)"/>
  <text x="895" y="205" font-size="13" fill="#6d6d68" text-anchor="middle">compaction</text>
  <g>
    <rect x="930" y="150" width="240" height="140" rx="14" fill="#1f2230" stroke="#4a5480" stroke-width="2" opacity="0.8"/>
    <g stroke="#8a93bf" stroke-width="4" stroke-linecap="round">
      <line x1="950" y1="176" x2="1120" y2="176"/><line x1="950" y1="196" x2="1060" y2="196"/>
      <line x1="950" y1="216" x2="1100" y2="216" opacity="0.35"/><line x1="950" y1="236" x2="1030" y2="236" opacity="0.2"/>
    </g>
  </g>
  <path d="M1180,220 L1230,220" stroke="#6d6d68" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1205" y="205" font-size="13" fill="#6d6d68" text-anchor="middle">compaction</text>
  <g>
    <rect x="1240" y="150" width="240" height="140" rx="14" fill="#1f2230" stroke="#4a5480" stroke-width="2" opacity="0.6"/>
    <g stroke="#8a93bf" stroke-width="4" stroke-linecap="round">
      <line x1="1260" y1="176" x2="1380" y2="176"/><line x1="1260" y1="196" x2="1320" y2="196" opacity="0.3"/>
    </g>
  </g>
  <g filter="url(#glow)">
    <rect x="620" y="380" width="860" height="70" rx="16" fill="#d97757"/>
  </g>
  <text x="650" y="424" font-size="22" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a1a1a">[s1] dead: X fails, needs a real Redis: use REDIS_URL=fake://</text>
  <text x="620" y="490" font-size="16" fill="#6d6d68" letter-spacing="2">NOTES ON DISK: SAME SIZE, EVERY TIME</text>
  <g stroke="#d97757" stroke-width="3" stroke-dasharray="7 7" fill="none">
    <path d="M740,376 L740,300" marker-end="url(#arr)"/>
    <path d="M1050,376 L1050,300" marker-end="url(#arr)"/>
    <path d="M1360,376 L1360,300" marker-end="url(#arr)"/>
  </g>
  <g>
    <rect x="90" y="330" width="150" height="56" rx="12" fill="#1c2a24" stroke="#3f7f5f" stroke-width="2"/>
    <text x="165" y="365" font-size="18" fill="#c9e6d5" text-anchor="middle">session A</text>
    <rect x="90" y="410" width="150" height="56" rx="12" fill="#1c2a24" stroke="#3f7f5f" stroke-width="2"/>
    <text x="165" y="445" font-size="18" fill="#c9e6d5" text-anchor="middle">session B</text>
    <rect x="300" y="370" width="200" height="56" rx="12" fill="#2a2418" stroke="#d97757" stroke-width="2"/>
    <text x="400" y="405" font-size="18" fill="#f2d6c4" text-anchor="middle">project .longrun/</text>
    <path d="M240,358 C280,358 280,398 300,398" stroke="#3f7f5f" stroke-width="2" fill="none"/>
    <path d="M240,438 C280,438 280,398 300,398" stroke="#3f7f5f" stroke-width="2" fill="none"/>
    <path d="M500,398 C560,398 560,415 620,415" stroke="#d97757" stroke-width="2" fill="none" stroke-dasharray="7 7"/>
  </g>
</svg>
